# Shared cluster only — applied once by the trainer, not by attendees.
#
# Lets attendees *read* the whole cluster: every namespace (the other
# attendees', kube-system, traefik, linkerd…) and the cluster-scoped objects
# that Headlamp's overview and `linkerd check` / `linkerd viz check` look at.
# Granted to all three identities an attendee uses:
#
#   - their kubectl certificate          group `trainees` (O=trainees)
#   - their web console                  ServiceAccounts of namespace `consoles`
#   - Headlamp                           ServiceAccount `headlamp` of their namespace
#
# Read only, and no Secrets: the built-in `view` role leaves them out, so the
# other attendees' tokens, the trainer's and Linkerd's CA keys stay hidden
# (the `linkerd check` items that read them fail with "forbidden", which is
# expected). Write access is still limited to their own namespace by their
# `admin` RoleBindings.
#
# A new attendee needs a Headlamp subject added below; the other two are groups.
#
#   kubectl apply -f shared-cluster/trainee-read.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trainee-cluster-read
rules:
  # Cluster-scoped objects, which `view` does not cover.
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers, csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
# Namespaced objects in every namespace, Secrets excepted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainees-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: trainees }
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:serviceaccounts:consoles" }
  - { kind: ServiceAccount, name: headlamp, namespace: abdelatif }
  - { kind: ServiceAccount, name: headlamp, namespace: ahlem }
  - { kind: ServiceAccount, name: headlamp, namespace: feriel }
  - { kind: ServiceAccount, name: headlamp, namespace: fouzia }
  - { kind: ServiceAccount, name: headlamp, namespace: imad }
  - { kind: ServiceAccount, name: headlamp, namespace: jean }
  - { kind: ServiceAccount, name: headlamp, namespace: milissa }
  - { kind: ServiceAccount, name: headlamp, namespace: yahia }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trainees-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trainee-cluster-read
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: trainees }
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:serviceaccounts:consoles" }
  - { kind: ServiceAccount, name: headlamp, namespace: abdelatif }
  - { kind: ServiceAccount, name: headlamp, namespace: ahlem }
  - { kind: ServiceAccount, name: headlamp, namespace: feriel }
  - { kind: ServiceAccount, name: headlamp, namespace: fouzia }
  - { kind: ServiceAccount, name: headlamp, namespace: imad }
  - { kind: ServiceAccount, name: headlamp, namespace: jean }
  - { kind: ServiceAccount, name: headlamp, namespace: milissa }
  - { kind: ServiceAccount, name: headlamp, namespace: yahia }
