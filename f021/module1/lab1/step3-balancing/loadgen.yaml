# Steady, boring traffic against productpage: one request per second, for as
# long as it runs. Step 3 uses it to watch requests spread over reviews
# v1/v2/v3; lab 2 reuses it, because a mesh dashboard with no traffic on it
# shows nothing at all.
#
# Scale it to 0 when you want the namespace quiet:
#   kubectl -n "$NS" scale deploy/loadgen --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: curl-loop
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null http://productpage:9080/productpage || echo "request failed"
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
