# Weighted routing needs something to weight. The `reviews` Service selects
# `app: reviews` and therefore covers all three versions at once — there is no
# way to address v3 on its own through it.
#
# These three Services add the missing handle: same pods, one Service per
# version. They are backends for the HTTPRoute, not entry points; the
# application keeps calling `reviews` and knows nothing about them.
#
# This is the bit Istio does differently: a DestinationRule declares `subsets`
# by label and no extra Services are needed. Same idea, different place to put
# it — worth putting side by side in the debrief.
apiVersion: v1
kind: Service
metadata:
  name: reviews-v1
  labels:
    app: reviews
    service: reviews-v1
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: reviews
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v2
  labels:
    app: reviews
    service: reviews-v2
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: reviews
    version: v2
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v3
  labels:
    app: reviews
    service: reviews-v3
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: reviews
    version: v3
