# Init container: runs to completion before productpage starts, and blocks
# the pod until `details` answers. Watch it do its job with
#   kubectl -n "$NS" logs deploy/productpage-v1 -c wait-for-details
#
# It is worth arguing about in the debrief: this makes startup ordering
# explicit, but a readiness probe plus a retry in the caller (step 5, and
# the mesh in lab 2) handles a dependency that goes away *later*, which an
# init container cannot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-details
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://details:9080/health; do
                echo "details not ready yet, waiting"
                sleep 2
              done
              echo "details is up, starting productpage"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
