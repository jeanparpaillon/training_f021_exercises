# Sidecar: a second container in the same pod, sharing the pod's volumes and
# network namespace. Here it ships logs — reviews runs on Open Liberty with
# LOG_DIR=/tmp/logs, so it writes `messages.log` to a file instead of stdout,
# which `kubectl logs` would never show you. The sidecar mounts the same
# emptyDir and re-emits the file on its own stdout:
#   kubectl -n "$NS" logs deploy/reviews-v1 -c log-shipper
#
# It goes on reviews rather than productpage because reviews is the service
# that actually writes log files — the pattern is only worth showing on a
# container that needs it. In production this container would be a Fluent Bit
# or Vector agent pointed at the same volume.
#
# Kubernetes 1.29+ also supports *native* sidecars: an entry under
# initContainers with `restartPolicy: Always`, which starts before the app
# and is torn down after it. Worth mentioning; the classic form below is
# what most charts still ship.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v1
spec:
  template:
    spec:
      containers:
        - name: log-shipper
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "log-shipper: waiting for a log file under /tmp/logs"
              until ls /tmp/logs/* >/dev/null 2>&1; do sleep 2; done
              exec tail -f /tmp/logs/*
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
