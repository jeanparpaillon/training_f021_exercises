# reviews stays at one replica per version: the Service already fans out over
# three pods, and tripling a JVM on every attendee's laptop buys nothing the
# lab needs. On a real cluster each version would get its own replicas >= 2.
#
# startupProbe rather than a long initialDelaySeconds: the pod gets as long
# as it needs to boot (30 x 5 s), then the fast liveness probe takes over.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v1
spec:
  template:
    spec:
      containers:
        - name: reviews
          startupProbe:
            httpGet:
              path: /health
              port: 9080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

