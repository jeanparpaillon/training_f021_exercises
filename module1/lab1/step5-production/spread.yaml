# Two replicas on the same node are one node failure away from zero. The
# constraint below asks the scheduler to spread productpage pods over nodes.
#
# `whenUnsatisfiable: ScheduleAnyway` is what makes this work on a one-node
# kind cluster: the scheduler prefers to spread, but still schedules when it
# cannot. Switch it to DoNotSchedule on a real multi-node cluster — and know
# that you have then made "spread" a hard requirement that can leave pods
# Pending.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: productpage
