# A PodDisruptionBudget only constrains *voluntary* disruption: a node drain,
# a cluster upgrade, `kubectl drain`. It does not protect against a crash or
# a node dying — that is what replicas are for.
#
# minAvailable: 1 with replicas: 2 means a drain may take one pod at a time
# and must wait for its replacement. Setting minAvailable equal to replicas
# is the classic mistake: it makes the node undrainable and blocks upgrades
# forever.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: productpage
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: productpage
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: details
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: details
