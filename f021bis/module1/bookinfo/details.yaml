# details — Ruby service, returns the book metadata. Called by productpage.
# Adapted from samples/bookinfo/platform/kube/bookinfo.yaml (Istio, Apache-2.0).
apiVersion: v1
kind: Service
metadata:
  name: details
  labels:
    app: details
    service: details
spec:
  type: NodePort
  ports:
    - port: 9080
      name: http
      nodePort: 30081
  selector:
    app: details
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-details
  labels:
    account: details
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-v1
  labels:
    app: details
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
    spec:
      serviceAccountName: bookinfo-details
      containers:
        - name: details
          image: registry.istio.io/release/examples-bookinfo-details-v1:1.20.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
