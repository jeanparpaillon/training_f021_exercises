# Bookinfo meshed: the namespace asks for injection. Applying this changes
# the Namespace only — injection happens when a pod is created (admission
# webhook), so the running pods stay unmeshed until
#
#   kubectl -n bookinfo rollout restart deploy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bookinfo

patches:
  - target: { kind: Namespace, name: bookinfo }
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          linkerd.io/inject: enabled
