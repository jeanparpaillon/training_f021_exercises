# Shared cluster only — applied once by the trainer, not by attendees.
#
# HTTP -> HTTPS for the host names that have a certificate. It is a router of
# its own rather than an entrypoint-wide redirection, because the attendees'
# *.nip.io names must stay plain HTTP on the same port.
#
# The ACME HTTP-01 challenge router Traefik creates internally has the highest
# priority, so /.well-known/acme-challenge/ still reaches it on these hosts.
#
#   kubectl apply -f shared-cluster/traefik-https.yaml
#
# The Ingresses for these hosts opt in to HTTPS with one annotation:
#
#   traefik.ingress.kubernetes.io/router.entrypoints: websecure
#
# TLS and the `le` resolver come from the websecure entrypoint itself
# (traefik-values.yaml). A host added here needs a matching Ingress, and vice
# versa.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: to-https
  namespace: traefik
spec:
  entryPoints: [web]
  routes:
    - match: >-
        Host(`srv2052563.hstgr.cloud`) ||
        Host(`chat.srv2052563.hstgr.cloud`) ||
        Host(`registry.srv2052563.hstgr.cloud`)
      middlewares:
        - name: to-https
      services:
        - kind: TraefikService
          name: noop@internal
