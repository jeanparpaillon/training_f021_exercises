# Shared cluster only — applied once by the trainer, after kube-prometheus-stack.
#
# Linkerd metrics in the kube-prometheus-stack Prometheus, so that Grafana,
# PrometheusRules (module 5 step 6) and Flagger can query request_total,
# response_latency_ms… The linkerd-viz Prometheus keeps running unchanged: it
# is what `linkerd viz stat|top` and the dashboard read, with 6 h retention.
#
#   kubectl apply -f shared-cluster/linkerd-scrape.yaml
#
# The jobs are those of Linkerd's "Bringing your own Prometheus"
# (linkerd.io/2-edge/tasks/external-prometheus/), checked against the
# linkerd-viz Prometheus config of edge-26.9.3, as ScrapeConfigs rather than
# PodMonitors: a PodMonitor adds its own relabelings and job name, the
# Linkerd dashboards and Flagger expect these. The values file sets
# scrapeConfigSelectorNilUsesHelmValues: false, so no `release` label needed.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: linkerd-controller
  namespace: monitoring
spec:
  jobName: linkerd-controller
  scrapeInterval: 10s
  kubernetesSDConfigs:
    - role: Pod
      namespaces:
        names: [linkerd, linkerd-viz]
  # Admin ports are named *-admin (dest-admin, ident-admin…), not admin-http
  # as in the docs: these rules are the running linkerd-viz ones
  # (kubectl -n linkerd-viz get cm prometheus-config).
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_container_port_name]
      action: keep
      regex: .*admin$
    - sourceLabels: [__meta_kubernetes_pod_container_port_name]
      action: drop
      regex: linkerd-admin
    # the linkerd-viz Prometheus itself: its server policy only admits its
    # own clients (403), and its metrics are of no use here
    - sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_container_name]
      action: drop
      regex: linkerd-viz;prometheus
    - sourceLabels: [__meta_kubernetes_pod_container_name]
      action: replace
      targetLabel: component
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: linkerd-proxy
  namespace: monitoring
spec:
  jobName: linkerd-proxy
  scrapeInterval: 10s
  kubernetesSDConfigs:
    - role: Pod
  relabelings:
    - sourceLabels:
        - __meta_kubernetes_pod_container_name
        - __meta_kubernetes_pod_container_port_name
        - __meta_kubernetes_pod_label_linkerd_io_control_plane_ns
      action: keep
      regex: ^linkerd-proxy;linkerd-admin;linkerd$
    - sourceLabels: [__meta_kubernetes_namespace]
      action: replace
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      action: replace
      targetLabel: pod
    # the pod's linkerd.io/proxy-job label must not clash with Prometheus' job
    - sourceLabels: [__meta_kubernetes_pod_label_linkerd_io_proxy_job]
      action: replace
      targetLabel: k8s_job
    - action: labeldrop
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_job
    # linkerd.io/proxy-deployment=foo => deployment=foo
    - action: labelmap
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
    - action: labeldrop
      regex: __meta_kubernetes_pod_label_linkerd_io_proxy_(.+)
    - action: labelmap
      regex: __meta_kubernetes_pod_label_linkerd_io_(.+)
    # every other pod label, linkerd_io_ prefix stripped
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
      replacement: __tmp_pod_label_$1
    - action: labelmap
      regex: __tmp_pod_label_linkerd_io_(.+)
      replacement: __tmp_pod_label_$1
    - action: labeldrop
      regex: __tmp_pod_label_linkerd_io_(.+)
    - action: labelmap
      regex: __tmp_pod_label_(.+)
